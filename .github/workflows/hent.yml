name: Hent DBU-kampdata

on:
  schedule:
    - cron: '30 4 * * *'   # dagligt kl. 06:30 dansk sommertid / 05:30 vintertid
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hent data fra DBU
        run: python3 hent_dbu.py

      - name: Commit ved ændringer
        run: |
          git config user.name "dbu-henter"
          git config user.email "actions@users.noreply.github.com"
          # Dagligt livstegn: uden aktivitet i 60 dage sætter GitHub cron-jobs på
          # pause (fx hen over sommerpausen). Filen viser samtidig seneste kørsel.
          date -u '+%Y-%m-%d %H:%M UTC' > senest-koert.txt
          # Netlify skal kun have en ny deploy, når selve SIDEN er ændret -
          # daglige dataopdateringer serveres fra GitHub og kræver ingen deploy.
          gammel_sum=$(cat netlify-checksum.txt 2>/dev/null || true)
          ny_sum=$(cat index.html manifest.json ikon-192.png apple-touch-icon.png | sha256sum | cut -d' ' -f1)
          echo "$ny_sum" > netlify-checksum.txt
          if [ "$gammel_sum" != "$ny_sum" ]; then echo "NETLIFY_DEPLOY=ja" >> "$GITHUB_ENV"; fi
          git add dbu-data.json puljer.json steder.json senest-koert.txt netlify-checksum.txt
          if git diff --cached --quiet; then
            echo "Ingen ændringer i dag."
          else
            git commit -m "DBU-opdatering $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Udgiv til Netlify (kun ved ændret side)
        if: env.NETLIFY_DEPLOY == 'ja'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          mkdir -p _netlify
          cp index.html manifest.json ikon-192.png apple-touch-icon.png _netlify/
          npx -y netlify-cli@17 deploy --prod --dir _netlify --site 7fb18b4f-0a04-49cc-847a-45281dc50e35
